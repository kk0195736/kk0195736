<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="{{ '/logo.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/favicon-32x32.png' | relative_url }}" sizes="32x32" type="image/png">
  <link rel="icon" href="{{ '/favicon-16x16.png' | relative_url }}" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --link: #4f46e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --text: #e6edf3;
        --muted: #9198a1;
        --border: #3d444d;
        --link: #a5b4fc;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 16px 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    .icon { display: block; width: 96px; height: 96px; margin: 0 auto 24px; }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    h1 {
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      font-size: 2em;
      line-height: 1.25;
    }
    h2 {
      margin: 24px 0 16px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      font-size: 1.5em;
      line-height: 1.25;
    }
    p { margin: 0 0 16px; }
    ul { margin: 0; padding-left: 2em; }
    li { margin-top: 4px; overflow-wrap: anywhere; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 24px; color: var(--muted); font-size: 13px; text-align: center; }
    @media (max-width: 480px) {
      main { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <img class="icon" src="{{ '/logo.svg' | relative_url }}" alt="" width="96" height="96">
  <main>
{{ content }}
  </main>
  <footer>© {{ site.title }}</footer>
</body>
</html>
